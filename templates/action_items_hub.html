{% extends "base.html" %}

{% block title %}Action Items - Sales Buddy{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h2><i class="bi bi-check2-square"></i> Action Items</h2>
</div>

{% include 'partials/_action_items_hub.html' %}

{% include 'partials/_action_item_detail_modal.html' %}

<script>
window.openActionItemsMilestone = function(event, msId, msTitle, msStatus, msUrl) {
    if (event.target.closest('a, button')) return;
    return SBMilestonePreview.open(msId, msTitle, msStatus, msUrl);
};
</script>

<!-- Engagement Detail Modal -->
<div class="modal fade" id="actionItemsEngagementModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-scrollable" style="max-width: min(1100px, calc(100vw - 3rem)); width: calc(100vw - 3rem);">
        <div class="modal-content" style="max-height: 90vh;">
            <div class="modal-header py-2">
                <div class="d-flex align-items-center gap-2">
                    <h5 class="modal-title mb-0"><i class="bi bi-diagram-3"></i> <span id="aiEngTitle">Loading...</span></h5>
                    <span id="aiEngBadge"></span>
                </div>
                <div class="d-flex align-items-center gap-2">
                    <a id="aiEngFullLink" href="#" class="btn btn-sm btn-outline-secondary"><i class="bi bi-arrows-fullscreen"></i> Full Page</a>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
            </div>
            <div class="modal-body p-3" id="aiEngBody">
                <div class="text-center py-5">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script>
(function() {
    var engModal = null;
    var titleEl = document.getElementById('aiEngTitle');
    var bodyEl = document.getElementById('aiEngBody');
    var badgeEl = document.getElementById('aiEngBadge');
    var fullLink = document.getElementById('aiEngFullLink');

    window.openActionItemsEngagement = function(engId, engTitle, engStatus) {
        if (!engModal) {
            engModal = new bootstrap.Modal(document.getElementById('actionItemsEngagementModal'));
        }
        titleEl.textContent = engTitle || 'Engagement';
        if (engStatus) {
            var cls = {'Active':'bg-success','Won':'bg-primary','Lost':'bg-danger','On Hold':'bg-warning text-dark'}[engStatus] || 'bg-secondary';
            badgeEl.innerHTML = '<span class="badge ' + cls + '">' + engStatus + '</span>';
        } else {
            badgeEl.innerHTML = '';
        }
        fullLink.href = '/engagement/' + engId;
        bodyEl.innerHTML = '<div class="text-center py-5"><div class="spinner-border text-primary" role="status"><span class="visually-hidden">Loading...</span></div></div>';
        engModal.show();
        fetch('/api/engagement/' + engId + '/detail')
            .then(function(r) { if (!r.ok) throw new Error(); return r.text(); })
            .then(function(html) {
                bodyEl.innerHTML = html;
                bodyEl.querySelectorAll('script').forEach(function(old) {
                    var s = document.createElement('script');
                    if (old.src) { s.src = old.src; } else { s.textContent = '(function(){' + old.textContent + '})();'; }
                    old.replaceWith(s);
                });
            })
            .catch(function() { bodyEl.innerHTML = '<div class="text-danger p-3"><i class="bi bi-exclamation-triangle"></i> Failed to load engagement details.</div>'; });
    };
})();
</script>
{% endblock %}
