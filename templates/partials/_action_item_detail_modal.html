{# Shared Action Item preview. Existing callers keep viewActionItem(id, options). #}
<link rel="stylesheet" href="{{ url_for('static', filename='css/ui-task-editor.css') }}">
<dialog class="sb-dialog sb-action-item-dialog" id="actionItemDetailModal"
        aria-labelledby="aiDetailTitle" data-sb-backdrop-close="true">
    <div class="sb-dialog-shell">
        <div class="sb-dialog-header">
            <div class="sb-dialog-heading">
                <div class="sb-dialog-eyebrow">Action item</div>
                <h2 id="aiDetailTitle">Action item</h2>
            </div>
            <span id="aiDetailDueBadge" class="sb-action-item-tag" hidden></span>
            <button type="button" class="sb-dialog-close" data-sb-dialog-close
                    aria-label="Close action item" autofocus>
                <i class="bi bi-x-lg" aria-hidden="true"></i>
            </button>
        </div>
        <div class="sb-dialog-body" id="aiDetailBody">
            <div class="sb-record-state" id="aiDetailLoading" role="status" hidden>
                Loading action item...
            </div>
            <div class="sb-record-state" id="aiDetailReadError" hidden>
                <p role="alert">Unable to load this action item.</p>
                <button type="button" class="sb-dialog-button" id="aiDetailRetry">Retry</button>
            </div>
            <div id="aiDetailViewMode" hidden>
                <div class="sb-action-item-meta" id="aiDetailMeta"></div>
                <div class="sb-action-item-description-row">
                    <div class="sb-action-item-description" id="aiDetailDesc"></div>
                    <label class="sb-action-item-completed" for="aiDetailCompleted">
                        <input type="checkbox" id="aiDetailCompleted"> Completed
                    </label>
                </div>
            </div>
            <form id="aiDetailEditMode" class="sb-action-item-form" hidden>
                <div>
                    <label class="sb-record-field-label" for="aiEditTitle">Title</label>
                    <input type="text" class="sb-record-field" id="aiEditTitle"
                           maxlength="300" required>
                </div>
                <div class="sb-action-item-form-row">
                    <div>
                        <label class="sb-record-field-label" for="aiEditDue">Due date</label>
                        <input type="date" class="sb-record-field" id="aiEditDue">
                    </div>
                    <div>
                        <label class="sb-record-field-label" for="aiEditPriority">Priority</label>
                        <select class="sb-record-field" id="aiEditPriority">
                            <option value="normal">Normal</option>
                            <option value="high">High</option>
                        </select>
                    </div>
                    <div>
                        <label class="sb-record-field-label" for="aiEditContact">Contact</label>
                        <input type="text" class="sb-record-field" id="aiEditContact" maxlength="200">
                    </div>
                </div>
                <div class="sb-task-rich">
                    <label class="sb-record-field-label" for="aiEditDesc">Description</label>
                    <textarea class="sb-record-field" id="aiEditDesc" rows="6"></textarea>
                </div>
            </form>
            <p id="aiDetailResult" class="sb-record-editor-error" role="status"
               aria-live="polite"></p>
        </div>
        <div class="sb-dialog-footer sb-action-item-footer" id="aiDetailFooter">
            <div id="aiDetailViewFooter" class="sb-action-item-commands" hidden>
                <button type="button" class="sb-dialog-button sb-action-item-danger"
                        id="aiDetailNotUsefulBtn" hidden title="Stop suggesting tasks like this one">
                    <i class="bi bi-hand-thumbs-down" aria-hidden="true"></i> Not Useful
                </button>
                <button type="button" class="sb-dialog-button" data-sb-dialog-close>Close</button>
                <button type="button" class="sb-dialog-button" id="aiDetailDismissBtn"
                        hidden title="Hide this task without completing it">
                    <i class="bi bi-x-lg" aria-hidden="true"></i> Dismiss
                </button>
                <div id="aiDetailSaveGroup" class="sb-action-item-save" hidden>
                    <label class="sb-dialog-eyebrow" for="aiDetailSaveDue">Due date (optional)</label>
                    <input type="date" class="sb-record-field" id="aiDetailSaveDue">
                    <button type="button" class="sb-dialog-button" id="aiDetailSaveBtn"
                            title="Pin this task so it survives the daily refresh">
                        <i class="bi bi-pin-angle" aria-hidden="true"></i> Save
                    </button>
                </div>
                <a href="#" class="sb-dialog-button" id="aiDetailEngLink" hidden>
                    <i class="bi bi-diagram-3" aria-hidden="true"></i> Go to Engagement
                </a>
                <button type="button" class="sb-dialog-button" id="aiDetailEditBtn">
                    <i class="bi bi-pencil" aria-hidden="true"></i> Edit
                </button>
            </div>
            <div id="aiDetailEditFooter" class="sb-action-item-commands" hidden>
                <button type="button" class="sb-dialog-button" id="aiDetailCancelEdit">Cancel</button>
                <button type="submit" class="sb-dialog-button" id="aiEditSaveBtn"
                        form="aiDetailEditMode">
                    <i class="bi bi-check-lg" aria-hidden="true"></i> Save
                </button>
            </div>
        </div>
    </div>
</dialog>
<dialog class="sb-dialog sb-dialog-compact" id="aiDiscardDialog"
        aria-labelledby="aiDiscardTitle">
    <div class="sb-dialog-shell">
        <div class="sb-dialog-header">
            <h2 id="aiDiscardTitle">Discard action item edits?</h2>
        </div>
        <div class="sb-dialog-body">Your edits have not been saved.</div>
        <div class="sb-dialog-footer">
            <button type="button" class="sb-dialog-button" data-sb-dialog-close autofocus>
                Keep editing
            </button>
            <button type="button" class="sb-dialog-button" id="aiDiscardConfirm">Discard edits</button>
        </div>
    </div>
</dialog>
<script src="{{ url_for('static', filename='js/ui-action-item-dialog.js') }}"></script>
