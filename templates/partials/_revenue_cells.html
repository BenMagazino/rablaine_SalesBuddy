{% macro revenue_cell(current_rev, prev_rev) %}
{% if current_rev %}
    {% set change = ((current_rev - prev_rev) / prev_rev * 100) if prev_rev > 0 else 0 %}
    <span{% if change < -10 %} data-tone="danger"{% elif change > 10 %} data-tone="positive"{% endif %}>${{ '{:,.0f}'.format(current_rev) }}</span>
{% else %}
    <span class="sb-revenue-missing">-</span>
{% endif %}
{% endmacro %}
