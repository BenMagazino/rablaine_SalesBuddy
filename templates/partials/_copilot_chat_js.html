    <!-- Copilot Chat JS (dev-only) -->
    <script>
    document.addEventListener('DOMContentLoaded', function() {
        const chatFlyoutEl = document.getElementById('copilotChatFlyout');
        const chatBtn = document.getElementById('navCopilotChat');
        if (!chatFlyoutEl || !chatBtn) return;

        const chatFlyout = {
            show() {
                chatFlyoutEl.hidden = false;
                document.body.classList.add('copilot-chat-open');
                chatBtn.classList.add('active');
                chatBtn.setAttribute('aria-expanded', 'true');
                sessionStorage.setItem(OPEN_KEY, '1');
                document.dispatchEvent(new CustomEvent('sb:chat-opened', {
                    detail: {open: true, width: 500},
                }));
                inputEl.focus();
            },
            hide() {
                chatFlyoutEl.hidden = true;
                document.body.classList.remove('copilot-chat-open');
                chatBtn.classList.remove('active');
                chatBtn.setAttribute('aria-expanded', 'false');
                sessionStorage.setItem(OPEN_KEY, '0');
                document.dispatchEvent(new CustomEvent('sb:chat-closed', {
                    detail: {open: false, width: 500},
                }));
                chatBtn.focus();
            },
            toggle() {
                if (chatFlyoutEl.hidden) this.show();
                else this.hide();
            },
        };
        const messagesEl = document.getElementById('copilotChatMessages');
        const inputEl = document.getElementById('copilotChatInput');
        const sendBtn = document.getElementById('copilotChatSend');
        const clearBtn = document.getElementById('copilotChatClear');

        // Conversation state
        let history = [];
        let isWaiting = false;
        const HISTORY_KEY = 'copilotChatHistory';
        const OPEN_KEY = 'copilotChatOpen';
        const MAX_HISTORY = 20;

        // --- Page context ---
        function getContext() {
            if (window.copilotContext) return window.copilotContext;
            // Auto-detect page from URL path
            const path = window.location.pathname;
            const ctx = { page: detectPage(path) };
            return ctx;
        }

        function detectPage(path) {
            // Map URL patterns to VALID_PAGES names
            const routes = [
                [/^\/customer\/\d+$/, 'customer_view'],
                [/^\/customers\/?$/, 'customers_list'],
                [/^\/engagement\/\d+$/, 'engagement_view'],
                [/^\/engagements\/?$/, 'engagements_hub'],
                [/^\/milestone\/\d+$/, 'milestone_view'],
                [/^\/milestones\/?$/, 'milestones_list'],
                [/^\/milestone-tracker\/?$/, 'milestone_tracker'],
                [/^\/note\/\d+$/, 'note_view'],
                [/^\/note\/(new|edit)/, 'note_form'],
                [/^\/notes\/?$/, 'notes_list'],
                [/^\/opportunity\/\d+$/, 'opportunity_view'],
                [/^\/partner\/\d+$/, 'partner_view'],
                [/^\/partners\/?$/, 'partners_list'],
                [/^\/pod\/\d+$/, 'pod_view'],
                [/^\/pods\/?$/, 'pods_list'],
                [/^\/seller\/\d+$/, 'seller_view'],
                [/^\/sellers\/?$/, 'sellers_list'],
                [/^\/revenue\/dashboard/, 'revenue_dashboard'],
                [/^\/revenue\/customer\/\d+$/, 'revenue_customer_view'],
                [/^\/reports\/?$/, 'reports_hub'],
                [/^\/reports\/workload/, 'report_workload'],
                [/^\/reports\/hygiene/, 'report_hygiene'],
                [/^\/reports\/whats-new/, 'report_whats_new'],
                [/^\/reports\/whitespace/, 'report_whitespace'],
                [/^\/reports\/one-on-one/, 'report_one_on_one'],
                [/^\/analytics/, 'analytics'],
                [/^\/fill-my-day/, 'fill_my_day'],
                [/^\/$/, 'index'],
            ];
            for (const [re, name] of routes) {
                if (re.test(path)) return name;
            }
            return 'index';
        }

        // --- Markdown rendering (lightweight) ---
        function renderMarkdownTable(block) {
            const lines = block.trim().split('\n');
            if (lines.length < 2) return null;
            // Verify separator row (2nd line must be like |---|---|)
            if (!/^\|?[\s-:|]+\|[\s-:|]+\|?$/.test(lines[1])) return null;
            function parseCells(line) {
                return line.replace(/^\|/, '').replace(/\|$/, '').split('|').map(c => c.trim());
            }
            const headers = parseCells(lines[0]);
            let tableHtml = '<table class="sb-chat-table"><thead><tr>';
            headers.forEach(h => { tableHtml += '<th>' + h + '</th>'; });
            tableHtml += '</tr></thead><tbody>';
            for (let i = 2; i < lines.length; i++) {
                if (!lines[i].trim()) continue;
                const cells = parseCells(lines[i]);
                tableHtml += '<tr>';
                cells.forEach(c => { tableHtml += '<td>' + c + '</td>'; });
                tableHtml += '</tr>';
            }
            tableHtml += '</tbody></table>';
            return tableHtml;
        }

        function renderMarkdown(text) {
            if (!text) return '';
            // Extract and render tables before other processing
            text = text.replace(/((?:^\|.+\|[ ]*(?:\n|$)){2,})/gm, function(match) {
                const table = renderMarkdownTable(match);
                return table ? table : match;
            });
            let html = text
                // Code blocks
                .replace(/```(\w*)\n([\s\S]*?)```/g, '<pre><code>$2</code></pre>')
                // Inline code
                .replace(/`([^`]+)`/g, '<code>$1</code>')
                // Headings (h4, h3, h2, h1 - order matters: longest prefix first)
                .replace(/^#### (.+)$/gm, '<h6>$1</h6>')
                .replace(/^### (.+)$/gm, '<h5>$1</h5>')
                .replace(/^## (.+)$/gm, '<h5>$1</h5>')
                .replace(/^# (.+)$/gm, '<h5>$1</h5>')
                // Bold
                .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
                // Italic
                .replace(/\*(.+?)\*/g, '<em>$1</em>')
                // Ordered lists
                .replace(/^\s*\d+\.\s+(.+)/gm, '<li>$1</li>')
                // Unordered lists
                .replace(/^\s*[-*]\s+(.+)/gm, '<li>$1</li>')
                // Wrap consecutive <li> in <ul>
                .replace(/((?:<li>.*<\/li>\n?)+)/g, '<ul>$1</ul>')
                // Links
                .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank">$1</a>')
                // Line breaks for paragraphs
                .replace(/\n\n/g, '</p><p>')
                .replace(/\n/g, '<br>');
            return '<p>' + html + '</p>';
        }

        // --- Message rendering ---
        function clearWelcome() {
            const welcome = messagesEl.querySelector('.sb-chat-welcome');
            if (welcome) welcome.remove();
        }

        function addMessage(role, content, toolsUsed) {
            clearWelcome();
            const div = document.createElement('div');
            div.className = 'copilot-msg copilot-msg-' + role;
            if (role === 'assistant') {
                div.innerHTML = renderMarkdown(content);
            } else {
                div.textContent = content;
            }
            messagesEl.appendChild(div);
            if (toolsUsed && toolsUsed.length > 0) {
                const badge = document.createElement('div');
                badge.className = 'copilot-tools-badge';
                const icon = document.createElement('i');
                icon.className = 'bi bi-tools';
                badge.append(icon, document.createTextNode(' ' + toolsUsed.join(', ')));
                messagesEl.appendChild(badge);
            }
            messagesEl.scrollTop = messagesEl.scrollHeight;
        }

        function showTyping() {
            clearWelcome();
            const div = document.createElement('div');
            div.className = 'copilot-msg copilot-msg-assistant copilot-typing';
            div.id = 'copilotTyping';
            div.setAttribute('role', 'status');
            div.setAttribute('aria-label', 'SalesIQ is responding');
            div.innerHTML = '<span></span><span></span><span></span>';
            messagesEl.appendChild(div);
            messagesEl.scrollTop = messagesEl.scrollHeight;
        }

        function removeTyping() {
            const el = document.getElementById('copilotTyping');
            if (el) el.remove();
        }

        // --- Restore messages from sessionStorage ---
        function restoreHistory() {
            try {
                const saved = sessionStorage.getItem(HISTORY_KEY);
                if (saved) {
                    const parsed = JSON.parse(saved);
                    if (Array.isArray(parsed) && parsed.length > 0) {
                        history = parsed;
                        parsed.forEach(msg => {
                            if (msg.role === 'user' || msg.role === 'assistant') {
                                addMessage(msg.role, msg.content);
                            }
                        });
                    }
                }
            } catch (e) { /* ignore */ }
        }

        function saveHistory() {
            try {
                sessionStorage.setItem(HISTORY_KEY, JSON.stringify(history.slice(-MAX_HISTORY)));
            } catch (e) { /* ignore */ }
        }

        // --- Send message ---
        async function sendMessage() {
            const text = inputEl.value.trim();
            if (!text || isWaiting) return;

            addMessage('user', text);
            history.push({ role: 'user', content: text });
            saveHistory();

            inputEl.value = '';
            inputEl.style.height = 'auto';
            isWaiting = true;
            sendBtn.disabled = true;
            clearBtn.disabled = true;
            messagesEl.setAttribute('aria-busy', 'true');
            showTyping();

            try {
                const resp = await fetch('/api/ai/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        message: text,
                        history: history.slice(-(MAX_HISTORY - 1)),
                        context: getContext(),
                    }),
                });
                const data = await resp.json();
                removeTyping();

                if (data.success && data.reply) {
                    addMessage('assistant', data.reply, data.tools_used);
                    history.push({ role: 'assistant', content: data.reply });
                    saveHistory();
                } else {
                    const errText = data.error || 'Something went wrong. Try again.';
                    addMessage('assistant', errText);
                }
            } catch (err) {
                removeTyping();
                addMessage('assistant', 'Network error. Make sure the app is running.');
            } finally {
                isWaiting = false;
                sendBtn.disabled = false;
                clearBtn.disabled = false;
                messagesEl.removeAttribute('aria-busy');
                inputEl.focus();
            }
        }

        // --- Event listeners ---
        sendBtn.addEventListener('click', sendMessage);
        inputEl.addEventListener('keydown', function(e) {
            if (e.defaultPrevented) return;
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        // Auto-resize textarea
        inputEl.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 120) + 'px';
        });

        // Clear conversation
        clearBtn.addEventListener('click', function() {
            if (isWaiting) return;
            history = [];
            sessionStorage.removeItem(HISTORY_KEY);
            messagesEl.innerHTML = '<div class="sb-chat-welcome">'
                + '<i class="bi bi-chat-dots" aria-hidden="true"></i>'
                + '<p>Ask me anything about your Sales Buddy data.</p></div>';
        });

        // Toggle on button click
        chatBtn.addEventListener('click', function() { chatFlyout.toggle(); });

        chatBtn.setAttribute('aria-controls', 'copilotChatFlyout');
        chatBtn.setAttribute('aria-expanded', 'false');
        document.getElementById('copilotChatClose').addEventListener('click',
            () => chatFlyout.hide());
        chatFlyoutEl.addEventListener('keydown', event => {
            if (event.defaultPrevented ||
                document.querySelector('.sb-dialog[open]:not([data-sb-nonmodal="true"])')) return;
            if (event.key === 'Escape') {
                event.preventDefault();
                event.stopPropagation();
                chatFlyout.hide();
            }
        });

        // Keyboard shortcut: Ctrl+Shift+C
        document.addEventListener('keydown', function(e) {
            if (e.defaultPrevented ||
                document.querySelector('.sb-dialog[open]:not([data-sb-nonmodal="true"])')) return;
            if (e.ctrlKey && e.shiftKey && e.key.toLowerCase() === 'c') {
                e.preventDefault();
                chatFlyout.toggle();
            }
        });

        // Restore state on page load
        restoreHistory();
        if (sessionStorage.getItem(OPEN_KEY) === '1') {
            // Open instantly without slide animation
            chatFlyoutEl.style.transition = 'none';
            chatFlyout.show();
            // Re-enable transitions after the flyout is rendered
            requestAnimationFrame(function() {
                requestAnimationFrame(function() {
                    chatFlyoutEl.style.transition = '';
                });
            });
        }
    });
    </script>
